<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle / Rounded App Icon Backdrop -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Glass Highlight Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Upper Flowing Wave -->
  <path d="M 13 27 C 19 20, 25 20, 32 26 C 39 32, 45 32, 51 24" 
        stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Lower Flowing Wave -->
  <path d="M 13 38 C 19 31, 25 31, 32 37 C 39 43, 45 43, 51 35" 
        stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Dynamic Liquidity Spark Dots -->
  <circle cx="48" cy="18" r="3.5" fill="#38BDF8" />
  <circle cx="48" cy="18" r="2" fill="#FFFFFF" />
  <circle cx="16" cy="46" r="2.5" fill="#60A5FA" opacity="0.9" />
</svg>
